[package]
name = "aqi-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-hal = { version = "1.1.1", features = ["esp32c6"] }
esp-rtos = { version = "0.3.0", features = ["esp32c6", "embassy"] }
esp-backtrace = { version = "0.19.0", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.17.0", features = ["esp32c6", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6"] }

embedded-graphics = "0.8.2"
embedded-graphics-framebuf = "0.5.0"

embassy-executor = "0.10.0"
embassy-time = "0.5.1"
embassy-sync = "0.8.0"

heapless = "0.8.0"

waveshare_display = { path = "../waveshare_display" }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = 'fat'
codegen-units = 1
panic = 'abort'